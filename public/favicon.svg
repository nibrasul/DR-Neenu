<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Brand gradients -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b61ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4b7c" />
      <stop offset="100%" stop-color="#2a2a4b" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="220" stroke="url(#logo-grad)" stroke-width="12" fill="rgba(10, 10, 20, 0.85)" />
  <circle cx="256" cy="256" r="235" stroke="rgba(0, 240, 255, 0.15)" stroke-width="2" />

  <!-- Vector Avatar of Dr. Neenu (Minimalist Cyber Academic Logo) -->
  <g filter="url(#glow-filter)">
    <!-- Neck -->
    <path d="M236 340 L236 380 L276 380 L276 340 Z" fill="#caa0ff" opacity="0.8" />
    <!-- V-Collar/Suit Top -->
    <path d="M190 380 L256 340 L322 380 L300 440 L212 440 Z" fill="url(#logo-grad)" />
    
    <!-- Face Contour -->
    <path d="M180 230 C180 320, 332 320, 332 230 C332 170, 180 170, 180 230 Z" fill="#f5f5fa" opacity="0.95" />
    
    <!-- Swept Tech Hair -->
    <path d="M170 210 C160 140, 220 100, 270 110 C320 120, 350 160, 340 220 C330 200, 320 190, 300 175 C270 155, 230 170, 190 200 Z" fill="url(#hair-grad)" />
    <!-- Swept Hair Bangs Side -->
    <path d="M175 190 C185 240, 210 260, 220 280 C210 260, 190 230, 175 190 Z" fill="url(#hair-grad)" opacity="0.9" />

    <!-- Minimalist Smart Glasses -->
    <!-- Left Glass Frame -->
    <circle cx="218" cy="225" r="30" stroke="url(#logo-grad)" stroke-width="8" />
    <!-- Right Glass Frame -->
    <circle cx="294" cy="225" r="30" stroke="url(#logo-grad)" stroke-width="8" />
    <!-- Glasses Bridge -->
    <path d="M248 225 L264 225" stroke="url(#logo-grad)" stroke-width="8" stroke-linecap="round" />
    <!-- Glasses Side frame left -->
    <path d="M188 225 L178 220" stroke="url(#logo-grad)" stroke-width="6" stroke-linecap="round" />
    <!-- Glasses Side frame right -->
    <path d="M324 225 L334 220" stroke="url(#logo-grad)" stroke-width="6" stroke-linecap="round" />

    <!-- Smiling Mouth -->
    <path d="M232 275 C242 288, 270 288, 280 275" stroke="#7b61ff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
