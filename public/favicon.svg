<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Glowing gradients -->
    <linearGradient id="monogram-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b61ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(123, 97, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0.1)" />
    </linearGradient>
    <!-- Drop Shadow Filter for Glow -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Cyber Shield Outer Boundary -->
  <path d="M256 30 L442 137 L442 375 L256 482 L70 375 L70 137 Z" 
        stroke="url(#shield-grad)" 
        stroke-width="12" 
        stroke-linejoin="round" 
        fill="rgba(10, 10, 20, 0.75)" />

  <path d="M256 50 L422 147 L422 365 L256 462 L90 365 L90 147 Z" 
        stroke="rgba(0, 240, 255, 0.15)" 
        stroke-width="2" 
        stroke-linejoin="round" />

  <!-- Stylized Geometric "NK" Monogram -->
  <g filter="url(#glow-filter)">
    <!-- Left vertical bar of N -->
    <path d="M160 145 L160 367" 
          stroke="url(#monogram-grad)" 
          stroke-width="28" 
          stroke-linecap="round" />
          
    <!-- Diagonal of N -->
    <path d="M160 145 L270 367" 
          stroke="url(#monogram-grad)" 
          stroke-width="28" 
          stroke-linecap="round" />
          
    <!-- Shared Right bar of N & Backbone of K -->
    <path d="M270 145 L270 367" 
          stroke="url(#monogram-grad)" 
          stroke-width="28" 
          stroke-linecap="round" />
          
    <!-- Upper Leg of K -->
    <path d="M270 256 L355 145" 
          stroke="url(#monogram-grad)" 
          stroke-width="28" 
          stroke-linecap="round" />
          
    <!-- Lower Leg of K -->
    <path d="M270 256 L355 367" 
          stroke="url(#monogram-grad)" 
          stroke-width="28" 
          stroke-linecap="round" />
  </g>
</svg>
